<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="description" content="Re:Order — your everyday care, in one place."><title>Re:Order — 리오더</title><meta name="apple-mobile-web-app-title" content="Re:Order"><link rel="icon" href="./assets/mark.png" type="image/png"><link rel="apple-touch-icon" href="./assets/mark.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<script src="./appearance.js"></script><div id="launch-screen" aria-hidden="true"><img src="./assets/wordmark.png" alt="" fetchpriority="high"></div><div class="shell"><header class="topbar"><button class="brand" id="brand" aria-label="Re:Order, go to today"><img class="brand-symbol" src="./assets/mark.png" alt=""><span class="brand-name">Re:Order</span></button><span class="top-hint">your care, in one place</span></header>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Main navigation"><button data-tab="today" aria-label="Today"><span class="nav-icon">◫</span>Today</button><button data-tab="calendar" aria-label="Calendar"><span class="nav-icon">▦</span>Calendar</button><button data-tab="guide" aria-label="Guides"><span class="nav-icon">☷</span>Guides</button><button data-tab="settings" aria-label="Settings"><span class="nav-icon">⚙</span>Settings</button></nav></div>
<dialog id="entry-dialog"><form id="entry-form"><div class="dialog-top"><div><div class="eyebrow">NEW ENTRY</div><h2>Keep a record</h2></div><button type="button" class="icon-button" id="close-entry" aria-label="Close">×</button></div><label>What is this about?<select name="category" id="entry-category"><option value="meal">Food & drink</option><option value="activity">Movement</option><option value="sleep">Sleep</option><option value="medication">Medication</option><option value="vitals">Body & health</option><option value="note">A note</option></select></label><label>Date<input name="date" type="date" required></label><label>Time (optional)<input name="time" type="time"></label><label id="detail-label">What would you like to remember?<textarea name="detail" rows="3" maxlength="800" placeholder="A few words are enough"></textarea></label><label class="photo-input">Add a photo (optional)<input id="entry-photo" type="file" accept="image/*"></label><div id="photo-preview"></div><p class="small-note">Saved on this device. You can export a backup in Settings.</p><button class="primary wide" type="submit">Save entry</button></form></dialog>
<dialog id="sleep-dialog"><form id="sleep-form"><div class="dialog-top"><div><div class="eyebrow">SLEEP</div><h2>How did you sleep?</h2></div><button type="button" class="icon-button" data-close-sleep aria-label="Close">×</button></div><label>Date<input name="date" type="date" required></label><div id="sleep-segments"></div><button type="button" class="secondary" id="add-nap">+ Add a nap</button><div class="sleep-total">Total sleep <strong id="sleep-total">0 h 0 m</strong></div><fieldset><legend>How did you feel after waking?</legend><div class="mood-row"><label><input type="radio" name="mood" value="good"><span>Good</span></label><label><input type="radio" name="mood" value="okay"><span>Okay</span></label><label><input type="radio" name="mood" value="bad"><span>Bad</span></label></div></fieldset><label>Dreams (optional)<textarea name="dream" rows="4" maxlength="1500" placeholder="Write down anything you remember"></textarea></label><label>Note (optional)<textarea name="note" rows="2" maxlength="500" placeholder="Woke up, noise, medication…"></textarea></label><p class="small-note">This record is for noticing patterns, not judging your sleep.</p><button class="primary wide" type="submit">Save sleep</button></form></dialog>
<link rel="stylesheet" href="./parts.css"><link rel="stylesheet" href="./sleep-grid.css"><link rel="stylesheet" href="./sleep-touch.css"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./today.css"><link rel="stylesheet" href="./food.css"><link rel="stylesheet" href="./body.css"><link rel="stylesheet" href="./medicine.css"><script src="./food.js" defer></script><script src="./body.js" defer></script><script src="./medicine.js" defer></script><link rel="stylesheet" href="./branding.css"><link rel="stylesheet" href="./export.css"><script src="./export.js" defer></script><script src="./launch.js" defer></script><script src="./app.js" defer></script></body></html>
